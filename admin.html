<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Orders</title><link rel="stylesheet" href="/style.css"></head><body><section class="section"><span class="eyebrow">ADMIN PANEL</span><h2>Customer Orders</h2><div id="orders"></div></section><script>
async function load(){const r=await fetch('/api/orders');const x=await r.json();document.getElementById('orders').innerHTML=x.length?x.map(o=>`<div class="service" style="margin:12px 0;display:block"><b>${o.id}</b> • ${o.service}<p>Name: ${o.name}<br>Phone: ${o.phone}<br>Details: ${o.details||'-'}<br>Location: ${o.latitude&&o.longitude?`<a target="_blank" href="https://maps.google.com/?q=${o.latitude},${o.longitude}">Open Map</a>`:'Not shared'}<br><small>${new Date(o.createdAt).toLocaleString()}</small></p></div>`).join(''):'<p>No orders yet.</p>'}load();setInterval(load,5000);
</script></body></html>
